services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tablewise
      POSTGRES_PASSWORD: tablewise
      POSTGRES_DB: tablewise
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Loaded automatically only when the pgdata volume is empty (first start / after a reset).
      # Refresh with ./script/db-dump.sh
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: pg_isready -U tablewise -h 127.0.0.1 # TCP: only ready after the init dump has loaded
      interval: 2s
      retries: 20

  app:
    image: node:20
    working_dir: /app
    env_file:
      - path: .env.local # git-ignored: OPENAI_API_KEY, TABLEWISE_AI_ENABLED, TABLEWISE_OPERATOR_TOKEN
        required: false
    command: sh -c "cp package-lock.json /tmp/lock.bak && sed -i 's|http://package-firewall.replit.internal/npm/|https://registry.npmjs.org/|g' package-lock.json && npm ci --no-audit --no-fund; cp /tmp/lock.bak package-lock.json; npx drizzle-kit push --force && npm run dev"
    environment:
      DATABASE_URL: postgresql://tablewise:tablewise@db:5432/tablewise
      PORT: 5000
      TABLEWISE_PUBLIC_CATALOG_REVIEWED: "true"
      TABLEWISE_DEV_CURATED_CATALOG: "true"
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules # keep Linux deps out of the Mac folder
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
